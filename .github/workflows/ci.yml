name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install PostgreSQL client tools (pg_dump/pg_restore for the backup tests)
        if: matrix.db == 'postgres'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations apply to an empty PostgreSQL database
        if: matrix.db == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://shop:ci-only-password@localhost:5432/shop_test
        run: python -m app.cli migrate
      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://shop:ci-only-password@localhost:5432/shop_test' || '' }}
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-only-password
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
          REFRESH_TOKEN_SECRET: ci-only-refresh-secret-0123456789abcdef0123
      - name: Start the stack
        run: docker compose up -d
        env:
          POSTGRES_PASSWORD: ci-only-password
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
          REFRESH_TOKEN_SECRET: ci-only-refresh-secret-0123456789abcdef0123
          COOKIE_SECURE: "false" # the smoke test talks plain HTTP to localhost
      - name: Smoke test (waits up to 4 minutes for migrations + health checks)
        run: |
          for i in $(seq 1 80); do
            curl -fsS http://localhost:8000/health 2>/dev/null | grep -q '"database":"ok"' && break
            sleep 3
          done
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"database":"ok"'
          curl -fsS -o /dev/null http://localhost:3000/login
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
        env:
          POSTGRES_PASSWORD: ci-only-password
          SECRET_KEY: x
          JWT_SECRET: x
          REFRESH_TOKEN_SECRET: x
      - name: Tear down
        if: always()
        run: docker compose down -v
        env:
          POSTGRES_PASSWORD: ci-only-password
          SECRET_KEY: x
          JWT_SECRET: x
          REFRESH_TOKEN_SECRET: x
